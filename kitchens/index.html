<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Kitchens — Auth Concepts</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Five themed mobile sign-in concepts for a food delivery app, shown in iPhone 15 Pro and Pixel 8 frames.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111114; --panel: #1A1A1F; --line: #2A2A31; --text: #ECEBEF; --muted: #9C9AA6; --accent: #FFB997;
  --tint: #FFB997;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 700px at 50% 110%, color-mix(in oklab, var(--tint) 22%, transparent), transparent 70%), var(--bg);
  color: var(--text); font: 15px/1.45 'Instrument Sans', system-ui, sans-serif; overflow: hidden;
  transition: background 0.6s;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- Header ---------- */
header {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px;
  padding: 14px 28px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px); position: relative; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { margin: 0; font: italic 400 28px/1 'Instrument Serif', serif; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.themes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.theme-tab {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px 6px 8px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line); color: var(--muted); transition: 0.2s;
}
.theme-tab:hover { color: var(--text); border-color: #3A3A44; }
.theme-tab[aria-selected="true"] { background: var(--text); color: #111; border-color: var(--text); }
.theme-tab .sw { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #111; }
.gh { color: var(--muted); font-size: 13px; text-decoration: none; }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; justify-content: center; gap: 16px; padding: 14px 20px 0; flex-wrap: wrap; position: relative; z-index: 4; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 999px; min-height: 36px; font-size: 14px; transition: 0.2s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: #2C2C34; color: var(--text); }
.seg-label { align-self: center; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }

/* ---------- Stage ---------- */
main { position: absolute; inset: 0; top: 0; display: grid; place-items: center; pointer-events: none; }
.stage { display: flex; gap: 64px; align-items: flex-start; transform-origin: center center; pointer-events: auto; }
.device-col { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.device-cap { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
.device-cap b { color: var(--text); font-weight: 500; }

.info {
  position: fixed; left: 28px; bottom: 24px; width: 280px; z-index: 4; pointer-events: auto;
  padding: 18px; border-radius: 18px; background: color-mix(in oklab, var(--panel) 88%, transparent); border: 1px solid var(--line);
}
.info .app-name { font: italic 400 30px/1 'Instrument Serif', serif; margin: 2px 0 4px; }
.info p { margin: 0; color: var(--muted); font-size: 13px; }
.info .palette { display: flex; gap: 6px; margin: 14px 0 10px; }
.info .palette i { width: 26px; height: 26px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.info dt { color: var(--muted); } .info dd { margin: 0; }
.info a { color: var(--text); }

/* ---------- iPhone 15 Pro (393 x 852) ---------- */
.iphone {
  --w: 393px; --h: 852px; position: relative; width: calc(var(--w) + 24px); height: calc(var(--h) + 24px);
  border-radius: 68px; padding: 12px;
  background: linear-gradient(145deg, #8E8A86, #4B4845 30%, #75716D 55%, #3D3B39 80%, #8C8884);
  box-shadow: 0 0 0 1px #2A2826, inset 0 0 0 1.5px rgba(255,255,255,0.35), 0 40px 80px -20px rgba(0,0,0,0.65), 0 18px 30px -12px rgba(0,0,0,0.5);
}
.iphone::before { /* inner black bezel ring */
  content: ""; position: absolute; inset: 4px; border-radius: 64px; background: #050505; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
}
.iphone .btn-side { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #5A5653, #8E8A86); }
.iphone .b1 { left: -3px; top: 120px; height: 32px; } .iphone .b2 { left: -3px; top: 180px; height: 62px; } .iphone .b3 { left: -3px; top: 256px; height: 62px; }
.iphone .b4 { right: -3px; top: 210px; height: 96px; }
.iphone .screen-wrap { position: relative; width: var(--w); height: var(--h); border-radius: 56px; overflow: hidden; background: #000; z-index: 1; }
.island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 3; }
.island::after { content: ""; position: absolute; right: 22px; top: 12px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2B3550, #0A0D16 60%); }
.home-ind { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 136px; height: 5px; border-radius: 3px; z-index: 3; }

/* ---------- Pixel 8 (412 x 915) ---------- */
.pixel {
  --w: 412px; --h: 915px; position: relative; width: calc(var(--w) + 22px); height: calc(var(--h) + 22px);
  border-radius: 52px; padding: 11px;
  background: linear-gradient(160deg, #3A3D42, #1E2023 40%, #2F3237 70%, #17181A);
  box-shadow: 0 0 0 1px #0E0F10, inset 0 0 0 1.5px rgba(255,255,255,0.18), 0 40px 80px -20px rgba(0,0,0,0.65), 0 18px 30px -12px rgba(0,0,0,0.5);
}
.pixel::before { content: ""; position: absolute; inset: 4px; border-radius: 48px; background: #030303; }
.pixel .btn-side { position: absolute; right: -3px; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #2F3237, #4A4D52); }
.pixel .p1 { top: 170px; height: 52px; } .pixel .p2 { top: 250px; height: 92px; }
.pixel .screen-wrap { position: relative; width: var(--w); height: var(--h); border-radius: 42px; overflow: hidden; background: #000; z-index: 1; }
.punch { position: absolute; top: 14px; left: 50%; translate: -50% 0; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #1E2638, #000 62%); z-index: 3; box-shadow: 0 0 0 2px rgba(0,0,0,0.6); }
.gesture { position: absolute; bottom: 9px; left: 50%; translate: -50% 0; width: 110px; height: 4px; border-radius: 2px; z-index: 3; }

/* ---------- Status bars (drawn over the app) ---------- */
.statusbar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.ios-sb { height: 54px; padding: 4px 34px 0 50px; font: 600 17px/1 -apple-system, 'SF Pro Text', 'Instrument Sans', sans-serif; letter-spacing: -0.01em; }
.and-sb { height: 40px; padding: 6px 26px 0 28px; font: 500 14px/1 'Roboto', 'Instrument Sans', sans-serif; }
.sb-icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { display: block; fill: currentColor; }
[data-ink="dark"] .statusbar { color: #111; } [data-ink="light"] .statusbar { color: #fff; }
[data-ink="dark"] .home-ind, [data-ink="dark"] .gesture { background: rgba(0,0,0,0.78); }
[data-ink="light"] .home-ind, [data-ink="light"] .gesture { background: rgba(255,255,255,0.85); }

iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }

@media (max-width: 1100px) { .info { display: none; } }
@media (max-width: 720px) {
  header { grid-template-columns: 1fr; gap: 10px; padding: 12px 16px; }
  .brand { justify-content: center; } .gh { display: none; }
  .themes { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; }
  .toolbar { padding: 10px 16px 0; gap: 8px; } .seg-label { display: none; }
  .seg button { padding: 8px 10px; }
  .stage { gap: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Five Kitchens</h1><span>auth concepts · food delivery</span></div>
  <nav class="themes" role="tablist" aria-label="Theme" id="themeTabs"></nav>
  <a class="gh" href="../index.html">← All demos</a>
</header>
<div class="toolbar">
  <span class="seg-label">Screen</span>
  <div class="seg" id="screenSeg" role="group" aria-label="Screen">
    <button data-screen="signin" aria-pressed="true">Sign in</button>
    <button data-screen="signup" aria-pressed="false">Sign up</button>
    <button data-screen="forgot" aria-pressed="false">Forgot</button>
    <button data-screen="home" aria-pressed="false">Home</button>
  </div>
  <span class="seg-label">State</span>
  <div class="seg" id="stateSeg" role="group" aria-label="Demo state">
    <button data-state="default" aria-pressed="true">Default</button>
    <button data-state="error" aria-pressed="false">Error</button>
    <button data-state="loading" aria-pressed="false">Loading</button>
    <button data-state="sent" aria-pressed="false" title="Forgot password success">Sent</button>
  </div>
</div>

<main>
  <div class="stage" id="stage">
    <div class="device-col">
      <div class="iphone" id="iphone">
        <i class="btn-side b1"></i><i class="btn-side b2"></i><i class="btn-side b3"></i><i class="btn-side b4"></i>
        <div class="screen-wrap">
          <div class="statusbar ios-sb">
            <span>9:41</span>
            <span class="sb-icons">
              <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .9C5.2.9 2.7 2 .8 3.8L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.2-1.2A7 7 0 0 0 8 4.2a7 7 0 0 0-4.9 1.9l1.2 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11.3l1.5-1.5c-.4-.4-.9-.6-1.5-.6Z"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity="0.45"/></svg>
            </span>
          </div>
          <div class="island"></div>
          <iframe id="f-ios" title="iPhone 15 Pro preview" loading="eager"></iframe>
          <div class="home-ind"></div>
        </div>
      </div>
      <div class="device-cap"><b>iPhone 15 Pro</b> · 393 × 852</div>
    </div>

    <div class="device-col">
      <div class="pixel" id="pixel">
        <i class="btn-side p1"></i><i class="btn-side p2"></i>
        <div class="screen-wrap">
          <div class="statusbar and-sb">
            <span>9:41</span>
            <span class="sb-icons">
              <svg width="15" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 12 0 3.2A11.7 11.7 0 0 1 8 0c3 0 5.8 1.2 8 3.2L8 12Z"/></svg>
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M12 0v12H0L12 0Z"/></svg>
              <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><rect x="2.5" y="0" width="3" height="1.5" rx="0.5"/><rect x="0" y="1.5" width="8" height="12.5" rx="1.5"/></svg>
            </span>
          </div>
          <div class="punch"></div>
          <iframe id="f-and" title="Pixel 8 preview" loading="eager"></iframe>
          <div class="gesture"></div>
        </div>
      </div>
      <div class="device-cap"><b>Pixel 8</b> · 412 × 915</div>
    </div>
  </div>
</main>

<aside class="info" id="info" aria-live="polite"></aside>

<script>
const THEMES = [
  { id: 'clay',   letter: 'A', name: 'Soft Clay 3D',         app: 'Dumpli',   tag: 'Dumplings & comfort bowls, delivered warm.', ink: 'dark',  tint: '#FFB997', fonts: 'Fredoka + Nunito',          palette: ['#FFF4E6', '#FFB997', '#FFE08A', '#C9B6FF', '#A8E6CF', '#4A2E22'] },
  { id: 'glass',  letter: 'B', name: 'Futuristic Glass',     app: 'Orbyt',    tag: 'Midnight food drops by drone.',                ink: 'light', tint: '#8B5CFF', fonts: 'Sora + JetBrains Mono',     palette: ['#070B1A', '#121A36', '#22E6FF', '#8B5CFF', '#FF3DCB', '#EAF2FF'] },
  { id: 'plush',  letter: 'C', name: 'Plush Textile',        app: 'Hearthly', tag: 'Home-cooked meals from cooks next door.',      ink: 'dark',  tint: '#C8664A', fonts: 'Fraunces + DM Sans',        palette: ['#F3EADB', '#E9DCC6', '#C8664A', '#9CAF88', '#D7A1A0', '#3F2B22'] },
  { id: 'brutal', letter: 'D', name: 'Neo Brutal Playful',   app: 'Grubby',   tag: 'Loud street food. Fast.',                      ink: 'dark',  tint: '#FFE14D', fonts: 'Archivo Black + Space Grotesk', palette: ['#FFF8EC', '#FFE14D', '#2346FF', '#FF4FA3', '#FF5A36', '#111111'] },
  { id: 'chrome', letter: 'E', name: 'Liquid Chrome Aurora', app: 'Lume',     tag: 'Chef-crafted dinners, quietly delivered.',     ink: 'dark',  tint: '#C9B8FF', fonts: 'Manrope',                   palette: ['#FFFFFF', '#F4F1EE', '#9CC9FF', '#C9B8FF', '#FFB8D9', '#1B1E3C'] },
];
const $ = (s) => document.querySelector(s);
const fIos = $('#f-ios'), fAnd = $('#f-and');
const st = { theme: 'clay', screen: 'signin' };
try { Object.assign(st, JSON.parse(localStorage.getItem('fk-state') || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search);
if (q.get('theme')) st.theme = q.get('theme');
if (q.get('screen')) st.screen = q.get('screen');

$('#themeTabs').innerHTML = THEMES.map((t) => `<button class="theme-tab" role="tab" data-theme="${t.id}" aria-selected="false"><span class="sw" style="background:${t.tint}">${t.letter}</span>${t.name}</button>`).join('');

function save() { try { localStorage.setItem('fk-state', JSON.stringify(st)); } catch (e) {} }
function pressed(seg, attr, val) { seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === val))); }

function loadTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  st.theme = t.id; save();
  document.querySelectorAll('.theme-tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.theme === t.id)));
  document.documentElement.style.setProperty('--tint', t.tint);
  $('#iphone').dataset.ink = $('#pixel').dataset.ink = t.ink;
  fIos.src = `themes/${t.id}/index.html?device=ios#${st.screen}`;
  fAnd.src = `themes/${t.id}/index.html?device=android#${st.screen}`;
  $('#info').innerHTML = `<p>${t.letter} · ${t.name}</p><div class="app-name">${t.app}</div><p>${t.tag}</p>
    <div class="palette">${t.palette.map((c) => `<i style="background:${c}" title="${c}"></i>`).join('')}</div>
    <dl><dt>Type</dt><dd>${t.fonts}</dd><dt>Rules</dt><dd><a href="refs/${t.id}/notes.md">refs/${t.id}/notes.md</a></dd></dl>`;
  pressed($('#stateSeg'), 'state', 'default');
}
function goScreen(name, from) {
  st.screen = name; save();
  pressed($('#screenSeg'), 'screen', name);
  pressed($('#stateSeg'), 'state', 'default');
  [fIos, fAnd].forEach((f) => f !== from && f.contentWindow && f.contentWindow.postMessage({ type: 'go', screen: name }, '*'));
}
$('#themeTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-theme]'); b && loadTheme(b.dataset.theme); });
$('#screenSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-screen]'); b && goScreen(b.dataset.screen); });
$('#stateSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-state]'); if (!b) return;
  let state = b.dataset.state;
  if (state === 'sent' && st.screen !== 'forgot') goScreen('forgot');
  pressed($('#stateSeg'), 'state', state);
  setTimeout(() => [fIos, fAnd].forEach((f) => f.contentWindow.postMessage({ type: 'state', state }, '*')), state === 'sent' ? 750 : 0);
});
addEventListener('message', (e) => {
  if (e.data && e.data.type === 'route') {
    const from = [fIos, fAnd].find((f) => f.contentWindow === e.source);
    if (e.data.screen !== st.screen) goScreen(e.data.screen, from);
  }
});

/* Fit both phones into the viewport */
function fit() {
  const stage = $('#stage');
  const top = document.querySelector('.toolbar').getBoundingClientRect().bottom + 16;
  const availH = innerHeight - top - 20, availW = innerWidth - 32;
  stage.style.transform = 'none';
  const w = stage.offsetWidth, h = stage.offsetHeight;
  const s = Math.min(1, availH / h, availW / w);
  stage.style.transform = `translateY(${(top + 4) / 2 - 10}px) scale(${s})`;
}
addEventListener('resize', fit);
loadTheme(st.theme); pressed($('#screenSeg'), 'screen', st.screen); fit();
/* ?state=error|loading|sent applies a demo state once the phones load (used for screenshots) */
if (q.get('state')) {
  pressed($('#stateSeg'), 'state', q.get('state'));
  [fIos, fAnd].forEach((f) => f.addEventListener('load', () => setTimeout(() => f.contentWindow.postMessage({ type: 'state', state: q.get('state') }, '*'), 200), { once: true }));
}
</script>
</body>
</html>
