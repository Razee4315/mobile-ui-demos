<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>Ease · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
  :root { --paper: #f7f4ee; --ink: #1c1b19; --muted: rgba(28,27,25,.55); --line: rgba(28,27,25,.1); --coral: #ff7a59; --sky: #9cc9ff; --butter: #ffe07a; --mint: #b9e8cf;
    --ease: cubic-bezier(.34, 1.56, .64, 1); }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.45 "Schibsted Grotesk", system-ui, sans-serif; display: flex; flex-direction: column; padding: var(--top) 20px var(--bottom); position: relative; overflow: hidden;
    background-image: radial-gradient(rgba(28,27,25,.09) 1px, transparent 1.4px); background-size: 16px 16px; }
  .mono { font-family: "JetBrains Mono", monospace; }
  header { display: flex; align-items: center; justify-content: space-between; height: 46px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 21px; letter-spacing: -.8px; }
  .brand svg { width: 28px; height: 28px; }
  .ghost { font-size: 13.5px; font-weight: 500; text-decoration: none; padding: 8px 13px; border-radius: 99px; background: #fff; border: 1px solid var(--line); }

  /* The curve card */
  .card { margin-top: auto; background: #fff; border-radius: 26px; border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(28,27,25,.04), 0 24px 40px -30px rgba(28,27,25,.35); padding: 12px 14px 10px; }
  .top { display: flex; gap: 12px; }
  .editor { width: 166px; flex: none; touch-action: none; overflow: visible; }
  .editor .grid { stroke: rgba(28,27,25,.07); }
  .editor .curve { fill: none; stroke: var(--coral); stroke-width: 3.5; stroke-linecap: round; }
  .editor .arm { stroke: rgba(28,27,25,.35); stroke-width: 1.2; }
  .editor .knob { fill: #fff; stroke: var(--ink); stroke-width: 2; transition: r .3s var(--spring); }
  .editor .hit { fill: transparent; cursor: grab; }
  .editor .hit:active { cursor: grabbing; }
  .editor g.drag .knob { r: 10; fill: var(--butter); }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
  .lbl { font: 500 10px/1 "JetBrains Mono", monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .val { font: 500 12.5px/1.45 "JetBrains Mono", monospace; color: var(--ink); background: #f4f1ea; border-radius: 10px; padding: 7px 9px; }
  .val b { color: var(--coral); font-weight: 500; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button { height: 30px; border-radius: 9px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: #fff; transition: background .3s, color .3s, transform .35s var(--spring); }
  .presets button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .track { position: relative; height: 34px; margin: 10px 0 4px; border-radius: 99px; background: #f4f1ea; }
  .ball { position: absolute; top: 5px; left: 5px; width: 24px; height: 24px; border-radius: 50%; background: var(--coral); box-shadow: 0 6px 14px -6px var(--coral); }
  .ghostball { position: absolute; top: 13px; left: 5px; width: 8px; height: 8px; border-radius: 50%; background: rgba(28,27,25,.18); }
  .timeline { position: relative; height: 26px; margin: 0 2px; touch-action: none; cursor: ew-resize; }
  .ticks { position: absolute; inset: 8px 0 auto; height: 10px; background: repeating-linear-gradient(90deg, rgba(28,27,25,.22) 0 1px, transparent 1px 10%); }
  .ticks::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(28,27,25,.12) 0 1px, transparent 1px 2.5%); height: 5px; top: 5px; }
  .kf { position: absolute; top: 9px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .kf.mid { background: var(--sky); }
  .head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--coral); }
  .head::before { content: ""; position: absolute; top: -3px; left: -4px; width: 10px; height: 8px; border-radius: 3px 3px 5px 5px; background: var(--coral); }
  .tl-meta { display: flex; justify-content: space-between; font: 400 10px/1 "JetBrains Mono", monospace; color: var(--muted); margin-top: 2px; }

  main.panes { margin-top: auto; }
  .pane { align-self: end; }
  h1 { font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -1.8px; margin: 0 0 8px; }
  h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 3px; }
  h1 .l { display: inline-block; transform: translateY(105%); }
  h1.play .l { transform: none; transition: transform .9s var(--ease) calc(var(--i) * 35ms); }
  h1 .c { color: var(--coral); }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
  .sub .mono { font-size: 12.5px; color: var(--ink); background: var(--butter); padding: 1px 5px; border-radius: 5px; }
  form { display: grid; gap: 10px; }
  .field { height: 52px; border-radius: 15px; background: #fff; border: 1px solid var(--line); padding: 0 15px; gap: 11px; color: var(--muted); transition: border-color .3s var(--ease), box-shadow .4s var(--ease); }
  .field:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(255,122,89,.25); color: var(--ink); }
  .field input { font-size: 15.5px; }
  .field input::placeholder { color: rgba(28,27,25,.38); }
  .field .ico { width: 19px; height: 19px; }
  .primary { height: 54px; border-radius: 15px; background: var(--ink); color: #fff; font-weight: 600; font-size: 15.5px; display: grid; place-items: center; transition: transform .5s var(--ease); }
  .primary:active { transform: scale(.94); transition-duration: .08s; }
  .primary .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
  .primary.done { background: #2e7d5b; }
  .foot { display: flex; justify-content: space-between; margin: 14px 2px 2px; font-size: 13.5px; color: var(--muted); }
  .foot a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .badge { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #fff; border: 1px dashed rgba(28,27,25,.2); }
  .badge svg { width: 40px; height: 40px; border-radius: 11px; background: var(--butter); flex: none; }
  .badge b { display: block; font-size: 14px; }
  .badge small { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header class="in" style="--d:0">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#1c1b19"/><path d="M7 24C14 24 12 8 25 8" fill="none" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="24" r="2.4" fill="#fff"/><circle cx="25" cy="8" r="2.4" fill="#fff"/></svg>
      ease
    </div>
    <a class="ghost only-login" href="#" data-go="signup">Sign up</a>
    <a class="ghost only-signup" href="#" data-go="login">Log in</a>
  </header>

  <section class="card in" style="--d:1" aria-label="Easing curve playground">
    <div class="top">
      <svg class="editor" id="ed" viewBox="0 0 200 220" aria-label="Drag the two handles to shape the easing curve">
        <g class="grid">
          <path d="M20 50H180M20 90H180M20 130H180M20 170H180M20 50V170M60 50V170M100 50V170M140 50V170M180 50V170" />
        </g>
        <path d="M20 170L180 50" stroke="rgba(28,27,25,.15)" stroke-dasharray="3 4"/>
        <line class="arm" id="a1"/><line class="arm" id="a2"/>
        <path class="curve" id="curve"/>
        <circle cx="20" cy="170" r="4" fill="#1c1b19"/><circle cx="180" cy="50" r="4" fill="#1c1b19"/>
        <g id="h1"><circle class="knob" r="7"/><circle class="hit" r="24"/></g>
        <g id="h2"><circle class="knob" r="7"/><circle class="hit" r="24"/></g>
      </svg>
      <div class="side">
        <span class="lbl">Easing</span>
        <div class="val" id="val"></div>
        <div class="presets" id="presets">
          <button class="press" data-p=".34,1.56,.64,1">Spring</button>
          <button class="press" data-p=".22,1,.36,1">Smooth</button>
          <button class="press" data-p=".7,0,.2,1">Snappy</button>
          <button class="press" data-p="0,0,1,1">Linear</button>
        </div>
      </div>
    </div>
    <div class="track" id="track"><span class="ghostball" id="gb"></span><span class="ball" id="ball"></span></div>
    <div class="timeline" id="tl" aria-label="Timeline, drag to scrub">
      <div class="ticks"></div>
      <span class="kf" style="left:0"></span><span class="kf mid" style="left:50%"></span><span class="kf" style="left:100%"></span>
      <span class="head" id="ph"></span>
    </div>
    <div class="tl-meta mono"><span>0.0s</span><span id="tlt">drag to scrub</span><span>1.0s</span></div>
  </section>

  <main class="panes">
    <section class="pane login" aria-label="Log in">
      <h1 class="split">Make things move <span class="c">nicely.</span></h1>
      <p class="sub in" style="--d:3">Drag the handles. <span class="mono">--ease</span> drives every transition here.</p>
      <form class="in" style="--d:4" novalidate>
        <label class="field"><i data-icon="mail"></i><span class="sr">Email</span><input type="email" placeholder="Email" autocomplete="email"></label>
        <label class="field"><i data-icon="lock"></i><span class="sr">Password</span><input type="password" placeholder="Password" autocomplete="current-password">
          <button class="eye" type="button" data-eye aria-label="Show password"><i data-icon="eye"></i><i data-icon="eye-off"></i></button></label>
        <button class="primary" type="submit"><span class="btn-label"><span class="pip"></span>Log in</span></button>
      </form>
      <div class="foot in" style="--d:5"><a href="#" data-fake>Forgot?</a><span>New here? <a href="#" data-go="signup">Join the studio</a></span></div>
    </section>

    <section class="pane signup" aria-label="Create account">
      <h1 class="split">Join the <span class="c">studio.</span></h1>
      <form novalidate>
        <div class="badge"><svg viewBox="0 0 40 40" id="badge"><path id="bpath" fill="none" stroke="#1c1b19" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span><b>Your curve is your badge</b><small>Shape it above. It goes on your profile.</small></span></div>
        <label class="field"><i data-icon="user"></i><span class="sr">Name</span><input type="text" placeholder="Name" autocomplete="name"></label>
        <label class="field"><i data-icon="mail"></i><span class="sr">Email</span><input type="email" placeholder="Email" autocomplete="email"></label>
        <label class="field"><i data-icon="lock"></i><span class="sr">Password</span><input type="password" placeholder="Password" autocomplete="new-password">
          <button class="eye" type="button" data-eye aria-label="Show password"><i data-icon="eye"></i><i data-icon="eye-off"></i></button></label>
        <button class="primary" type="submit"><span class="btn-label"><span class="pip"></span>Start animating</span></button>
      </form>
      <div class="foot"><span>Have an account?</span><a href="#" data-go="login">Log in</a></div>
    </section>
  </main>

  <script src="../../../shared/icons.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
  (() => {
    const { loop, haptic } = Kit;
    const root = document.documentElement;
    const $ = id => document.getElementById(id);

    /* ---------- cubic-bezier maths ---------- */
    const bez = (p1x, p1y, p2x, p2y) => {
      const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
      const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
      const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
      return x => {
        let t = x;
        for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5) break; if (Math.abs(d) < 1e-6) break; t -= e / d; }
        if (t < 0 || t > 1 || Math.abs(sx(t) - x) > 1e-3) { let lo = 0, hi = 1; t = x; for (let i = 0; i < 20; i++) { sx(t) < x ? lo = t : hi = t; t = (lo + hi) / 2; } }
        return sy(t);
      };
    };

    /* ---------- editor ---------- */
    const X = x => 20 + x * 160, Y = y => 170 - y * 120;
    const ux = X => (X - 20) / 160, uy = Y => (170 - Y) / 120;
    let P = [.34, 1.56, .64, 1], fn = bez(...P);
    const ed = $('ed'), H = [$('h1'), $('h2')];
    const fmt = n => (Math.round(n * 100) / 100).toString().replace(/^0\./, '.').replace(/^-0\./, '-.');
    const render = () => {
      const [a, b, c, d] = P;
      $('curve').setAttribute('d', `M${X(0)} ${Y(0)} C${X(a)} ${Y(b)} ${X(c)} ${Y(d)} ${X(1)} ${Y(1)}`);
      $('a1').setAttribute('x1', X(0)); $('a1').setAttribute('y1', Y(0)); $('a1').setAttribute('x2', X(a)); $('a1').setAttribute('y2', Y(b));
      $('a2').setAttribute('x1', X(1)); $('a2').setAttribute('y1', Y(1)); $('a2').setAttribute('x2', X(c)); $('a2').setAttribute('y2', Y(d));
      H[0].setAttribute('transform', `translate(${X(a)} ${Y(b)})`); H[1].setAttribute('transform', `translate(${X(c)} ${Y(d)})`);
      $('val').innerHTML = `cubic-bezier(<br><b>${fmt(a)}, ${fmt(b)}</b>,<br><b>${fmt(c)}, ${fmt(d)}</b>)`;
      const css = `cubic-bezier(${a.toFixed(3)}, ${b.toFixed(3)}, ${c.toFixed(3)}, ${d.toFixed(3)})`;
      root.style.setProperty('--ease', css);
      root.style.setProperty('--spring', css);
      $('bpath').setAttribute('d', `M7 33 C${7 + a * 26} ${33 - b * 26} ${7 + c * 26} ${33 - d * 26} 33 7`);
      fn = bez(a, b, c, d);
      document.querySelectorAll('#presets button').forEach(btn => btn.classList.toggle('on', btn.dataset.p.split(',').map(Number).every((v, i) => Math.abs(v - P[i]) < .01)));
    };
    render();

    let dragging = -1;
    const toSvg = e => { const m = ed.getScreenCTM().inverse(); return new DOMPoint(e.clientX, e.clientY).matrixTransform(m); };
    H.forEach((h, i) => h.addEventListener('pointerdown', e => { dragging = i; h.classList.add('drag'); ed.setPointerCapture(e.pointerId); haptic(5); e.preventDefault(); }));
    ed.addEventListener('pointermove', e => {
      if (dragging < 0) return;
      const p = toSvg(e);
      const x = Math.max(0, Math.min(1, ux(p.x))), y = Math.max(-.45, Math.min(1.45, uy(p.y)));
      if (dragging === 0) { P[0] = x; P[1] = y; } else { P[2] = x; P[3] = y; }
      render();
    });
    const release = () => { if (dragging < 0) return; H[dragging].classList.remove('drag'); dragging = -1; replay(); };
    ed.addEventListener('pointerup', release); ed.addEventListener('pointercancel', release);

    // presets tween the handles using the curve that's currently set (so the UI demonstrates itself)
    $('presets').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const to = b.dataset.p.split(',').map(Number), from = P.slice(), f = fn, t0 = performance.now();
      haptic(6);
      const step = now => {
        const k = Math.min(1, (now - t0) / 650), e2 = f(k);
        P = from.map((v, i) => v + (to[i] - v) * e2);
        P[0] = Math.max(0, Math.min(1, P[0])); P[2] = Math.max(0, Math.min(1, P[2]));
        render();
        if (k < 1) requestAnimationFrame(step); else { P = to.slice(); render(); replay(); }
      };
      requestAnimationFrame(step);
    });

    /* ---------- preview ball + scrubbable timeline ---------- */
    const ball = $('ball'), gb = $('gb'), ph = $('ph'), track = $('track'), tl = $('tl');
    let clock = 0, scrub = null;
    const DUR = 1.1, HOLD = .55, CYCLE = (DUR + HOLD) * 2;
    loop(dt => {
      if (scrub === null) clock = (clock + dt) % CYCLE;
      let p;
      if (scrub !== null) p = scrub;
      else {
        const c = clock;
        p = c < DUR ? c / DUR : c < DUR + HOLD ? 1 : c < 2 * DUR + HOLD ? 1 - (c - DUR - HOLD) / DUR : 0;
      }
      // leave room either side so overshoot stays visible inside the rail
      const room = track.clientWidth - 34, span = room * .76, off = room * .12;
      const y = fn(p);
      const yc = Math.max(-.15, Math.min(1.15, y));
      ball.style.transform = `translateX(${off + yc * span}px) scale(${1 + Math.min(.3, Math.abs(y - p) * .25)})`;
      gb.style.transform = `translateX(${off + 8 + p * span}px)`;
      ph.style.left = (p * 100) + '%';
    });
    const scrubAt = e => { const r = tl.getBoundingClientRect(); scrub = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); $('tlt').textContent = (scrub).toFixed(2) + 's'; };
    tl.addEventListener('pointerdown', e => { tl.setPointerCapture(e.pointerId); scrubAt(e); haptic(4); });
    tl.addEventListener('pointermove', e => { if (scrub !== null) scrubAt(e); });
    const endScrub = () => { if (scrub === null) return; clock = scrub * DUR; scrub = null; $('tlt').textContent = 'drag to scrub'; };
    tl.addEventListener('pointerup', endScrub); tl.addEventListener('pointercancel', endScrub);
    track.addEventListener('pointerdown', () => { clock = 0; haptic(4); });

    /* ---------- headline letters animate in with the current curve ---------- */
    document.querySelectorAll('h1.split').forEach(h => {
      let i = 0;
      const walk = node => [...node.childNodes].forEach(n => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(word => {
            if (!word) return;
            if (/^\s+$/.test(word)) { frag.append(' '); return; }
            const w = document.createElement('span'); w.className = 'w';
            [...word].forEach(ch => { const l = document.createElement('span'); l.className = 'l'; l.textContent = ch; l.style.setProperty('--i', i++); w.append(l); });
            frag.append(w);
          });
          n.replaceWith(frag);
        } else walk(n);
      });
      walk(h);
    });
    const replay = () => {
      const h = document.querySelector('.pane.' + root.dataset.view + ' h1.split');
      h.classList.remove('play'); void h.offsetWidth; h.classList.add('play');
    };
    document.addEventListener('kit:ready', () => setTimeout(replay, 250));
    document.addEventListener('kit:view', () => setTimeout(replay, 120));
  })();
  </script>
</body>
</html>
