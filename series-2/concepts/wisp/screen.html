<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<title>Wisp · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/kit.css">
<style>
  :root { --bg: #fbf8f4; --ink: #24222b; --muted: rgba(36,34,43,.52); --line: rgba(36,34,43,.08); --apricot: #ffcaa8; --lilac: #d6d0ff; --sea: #bfe9dc; --blush: #ffc8da; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 Geist, system-ui, sans-serif; display: flex; flex-direction: column; padding: var(--top) 22px var(--bottom); position: relative; overflow: hidden; }

  /* Soft washes of colour that drift behind everything */
  .wash { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .wash i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .wash i:nth-child(1) { width: 320px; height: 320px; left: -120px; top: 60px; background: var(--apricot); animation: driftA 18s ease-in-out infinite alternate; }
  .wash i:nth-child(2) { width: 300px; height: 300px; right: -140px; top: 180px; background: var(--lilac); animation: driftB 22s ease-in-out infinite alternate; }
  .wash i:nth-child(3) { width: 260px; height: 260px; left: 30%; bottom: -160px; background: var(--sea); opacity: .4; animation: driftA 26s ease-in-out infinite alternate-reverse; }
  @keyframes driftA { to { transform: translate(60px, 40px) scale(1.15); } }
  @keyframes driftB { to { transform: translate(-50px, 70px) scale(.9); } }

  header { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; height: 46px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 19px; letter-spacing: -.5px; }
  .brand svg { width: 26px; height: 26px; }
  .ghost { font-size: 13.5px; color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 99px; transition: background .3s, color .3s; }
  .ghost:hover { background: rgba(36,34,43,.05); color: var(--ink); }

  /* The orb: a WebGL shader with a minimal face */
  .orb { position: absolute; left: 50%; top: 0; z-index: 2; width: 220px; height: 220px; margin: -110px 0 0 -110px; touch-action: none; cursor: grab; will-change: transform; }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orb .fallback { position: absolute; inset: 7%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, transparent 30%), conic-gradient(from 0deg, var(--apricot), var(--lilac), var(--sea), var(--blush), var(--apricot)); filter: blur(2px); animation: spin 14s linear infinite; display: none; }
  .no-gl .orb .fallback { display: block; }
  .orb .halo { position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,202,168,.5), rgba(214,208,255,.25) 60%, transparent); filter: blur(10px); z-index: -1; }
  .face { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .eye { position: absolute; width: calc(var(--es, 1) * 11px); height: calc(var(--es, 1) * 17px); margin: calc(var(--es, 1) * -8.5px) 0 0 calc(var(--es, 1) * -5.5px); }
  .eye .open { position: absolute; inset: 0; border-radius: 99px; background: var(--ink); opacity: .82; transform: scaleY(var(--blink, 1)); transition: opacity .25s; }
  .eye .shut { position: absolute; left: -15%; right: -15%; top: 30%; height: 45%; border: calc(var(--es, 1) * 2.6px) solid var(--ink); border-top: 0; border-radius: 0 0 99px 99px; opacity: 0; transition: opacity .25s; }
  .shy .eye .open { opacity: 0; }
  .shy .eye .shut { opacity: .8; }
  .blush-dot { position: absolute; width: calc(var(--es, 1) * 16px); height: calc(var(--es, 1) * 8px); margin: calc(var(--es, 1) * -4px) 0 0 calc(var(--es, 1) * -8px); border-radius: 50%; background: #ff9fb6; filter: blur(3px); opacity: 0; transition: opacity .5s; }
  .shy .blush-dot { opacity: .65; }
  .shadow { position: absolute; left: 50%; width: 120px; height: 16px; margin-left: -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,100,160,.18), transparent); z-index: 1; pointer-events: none; }

  main.panes { margin-top: auto; position: relative; z-index: 3; }
  .pane { align-self: end; }

  /* Login */
  .say { font: 500 30px/1.12 Geist, sans-serif; letter-spacing: -1.1px; margin: 0; min-height: 34px; }
  .say2 { font: italic 400 25px/1.2 Newsreader, serif; letter-spacing: -.4px; color: var(--muted); margin: 2px 0 18px; min-height: 30px; }
  .tok { animation: tok .45s var(--ease) both; display: inline; }
  @keyframes tok { from { opacity: 0; filter: blur(4px); } }
  .stream-caret { display: inline-block; width: 8px; height: .9em; margin-left: 2px; vertical-align: -2px; border-radius: 4px; background: linear-gradient(var(--apricot), var(--lilac)); animation: caretBlink 1s steps(2) infinite; }
  @keyframes caretBlink { 50% { opacity: 0; } }

  .chips { display: flex; gap: 8px; overflow: hidden; margin: 0 -22px 16px; padding: 2px 22px; -webkit-mask: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); mask: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent); }
  .chips-track { display: flex; gap: 8px; animation: marquee 32s linear infinite; }
  .chips:hover .chips-track { animation-play-state: paused; }
  .chip { flex: none; font-size: 13px; padding: 8px 13px; border-radius: 99px; background: rgba(255,255,255,.7); border: 1px solid var(--line); backdrop-filter: blur(10px); white-space: nowrap; color: rgba(36,34,43,.75); }
  .chip:hover { background: #fff; color: var(--ink); }
  @keyframes marquee { to { transform: translateX(calc(-50% - 4px)); } }

  .card { background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9); border-radius: 22px; box-shadow: 0 1px 0 rgba(36,34,43,.04), 0 18px 40px -22px rgba(90,70,130,.25); backdrop-filter: blur(16px); overflow: hidden; }
  .card .field { height: 56px; padding: 0 16px; gap: 12px; color: var(--muted); transition: background .3s; }
  .card .field + .field { border-top: 1px solid var(--line); }
  .card .field:focus-within { background: rgba(255,255,255,.95); color: var(--ink); }
  .card .field input { font-size: 15.5px; color: var(--ink); }
  .card .field input::placeholder { color: rgba(36,34,43,.38); }
  .card .field a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .card .ico { width: 19px; height: 19px; }

  .primary { width: 100%; height: 54px; margin-top: 12px; border-radius: 18px; background: var(--ink); color: #fff; font-weight: 500; font-size: 15.5px; display: grid; place-items: center; box-shadow: 0 14px 30px -14px rgba(36,34,43,.6); }
  .primary .spark { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--apricot), var(--lilac), var(--sea), var(--blush), var(--apricot)); animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .primary.done { background: #3f8f6f; }
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .socials button { height: 48px; border-radius: 16px; background: rgba(255,255,255,.6); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 14.5px; }
  .socials .ico { width: 18px; height: 18px; }
  .foot { text-align: center; font-size: 14px; color: var(--muted); margin: 16px 0 4px; }
  .foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
  .foot a span { display: inline-block; transition: transform .3s var(--spring); }
  .foot a:hover span { transform: translateX(4px); }

  /* Sign up: the form is a conversation */
  .thread { height: 372px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; padding-bottom: 6px;
    -webkit-mask: linear-gradient(transparent, #000 60px); mask: linear-gradient(transparent, #000 60px); }
  .msg { display: flex; gap: 10px; align-items: flex-end; animation: msgIn .55s var(--spring) both; transform-origin: bottom left; }
  .msg.me { justify-content: flex-end; transform-origin: bottom right; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(14px) scale(.92); } }
  .msg .av { flex: none; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--apricot), var(--lilac), var(--sea), var(--blush), var(--apricot)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); animation: spin 8s linear infinite; }
  .msg p { margin: 0; max-width: 78%; font-size: 15.5px; line-height: 1.4; }
  .msg.ai p { padding: 2px 0; }
  .msg.me p { background: var(--ink); color: #fff; padding: 10px 15px; border-radius: 20px 20px 6px 20px; }
  .typing { display: inline-flex; gap: 4px; padding: 10px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: rgba(36,34,43,.35); animation: bounce 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 30% { transform: translateY(-5px); opacity: 1; } }
  .composer { display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 7px 0 18px; border-radius: 99px; background: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.95); box-shadow: 0 16px 36px -20px rgba(90,70,130,.35); margin-top: 8px; transition: box-shadow .3s; }
  .composer:focus-within { box-shadow: 0 0 0 4px rgba(214,208,255,.55), 0 16px 36px -20px rgba(90,70,130,.35); }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15.5px; }
  .composer input::placeholder { color: rgba(36,34,43,.38); }
  .send { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transform: scale(.82); opacity: .35; transition: transform .35s var(--spring), opacity .25s; }
  .send.on { transform: scale(1); opacity: 1; }
  .send .ico { width: 19px; height: 19px; transform: rotate(-90deg); }
  .alt { display: flex; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--muted); margin: 14px 0 4px; }
  .alt a { color: var(--ink); text-decoration: none; font-weight: 500; }
  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
</style>
</head>
<body>
  <div class="wash" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="in" style="--d:0" data-head>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb98f"/><stop offset=".5" stop-color="#b9adff"/><stop offset="1" stop-color="#8fd8c1"/></linearGradient></defs>
        <circle cx="16" cy="16" r="13" fill="url(#wg)"/>
        <path d="M9.5 18.5c2.2 2.4 5.6 3 8.4 1.4 2.2-1.3 3-3.7 1.8-5.4-1.1-1.5-3.4-1.4-4.2.2-.6 1.2.2 2.5 1.5 2.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      wisp
    </div>
    <a class="ghost only-login" href="#" data-go="signup">Sign up</a>
    <a class="ghost only-signup" href="#" data-go="login">Log in</a>
  </header>

  <div class="shadow" id="shadow" aria-hidden="true"></div>
  <div class="orb in" style="--d:1" id="orb" role="img" aria-label="Wisp, a soft glowing orb with two little eyes">
    <div class="halo"></div>
    <div class="fallback"></div>
    <canvas id="gl"></canvas>
    <div class="face" id="face">
      <span class="blush-dot" id="bl"></span><span class="blush-dot" id="br"></span>
      <span class="eye" id="el"><i class="open"></i><i class="shut"></i></span>
      <span class="eye" id="er"><i class="open"></i><i class="shut"></i></span>
    </div>
  </div>

  <main class="panes">
    <section class="pane login" aria-label="Sign in">
      <h1 class="say" id="say" aria-live="polite"></h1>
      <p class="say2" id="say2"></p>
      <div class="chips in" style="--d:3" aria-label="Things Wisp can help with">
        <div class="chips-track" id="chips"></div>
      </div>
      <form class="in" style="--d:4" novalidate>
        <div class="card">
          <label class="field"><i data-icon="mail"></i><span class="sr">Email</span><input type="email" placeholder="Email" autocomplete="email" id="email"></label>
          <label class="field"><i data-icon="lock"></i><span class="sr">Password</span><input type="password" placeholder="Password" autocomplete="current-password" id="pw"><a href="#" data-fake>Forgot?</a></label>
        </div>
        <button class="primary press" type="submit"><span class="btn-label"><span class="spark"></span>Continue</span></button>
      </form>
      <div class="in" style="--d:5">
        <div class="socials">
          <button class="press" data-fake data-ripple><i data-icon="apple"></i>Apple</button>
          <button class="press" data-fake data-ripple><i data-icon="google"></i>Google</button>
        </div>
        <p class="foot">New here? <a href="#" data-go="signup">Say hello <span>→</span></a></p>
      </div>
    </section>

    <section class="pane signup" aria-label="Create account">
      <div class="thread" id="thread" aria-live="polite"></div>
      <form class="composer" id="composer" novalidate>
        <label class="sr" for="cin">Your answer</label>
        <input id="cin" type="text" placeholder="Type here…" autocomplete="off">
        <button class="send" id="send" type="button" aria-label="Send"><i data-icon="arrow"></i></button>
      </form>
      <div class="alt">or continue with <a href="#" data-fake>Apple</a>·<a href="#" data-fake>Google</a></div>
      <div class="alt">Been here before? <a href="#" data-go="login">Log in</a></div>
    </section>
  </main>

  <script src="../../../shared/icons.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
  (() => {
    const { Spring, loop, gaze, caret, stream, haptic } = Kit;
    const root = document.documentElement;
    const orb = document.getElementById('orb'), face = document.getElementById('face'), shadow = document.getElementById('shadow');
    const eyes = [document.getElementById('el'), document.getElementById('er')];
    const blushes = [document.getElementById('bl'), document.getElementById('br')];

    /* ---------- WebGL orb ---------- */
    const cv = document.getElementById('gl');
    const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true });
    let draw = () => {};
    if (!gl) root.classList.add('no-gl');
    else {
      const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
      const fs = `precision highp float;
      uniform vec2 uRes;uniform float uT,uE,uShy;uniform vec2 uLook;
      vec3 pal(float x){vec3 a=vec3(1.,.80,.66),b=vec3(.84,.81,1.),c=vec3(.75,.92,.86),d=vec3(1.,.79,.86);
        x=fract(x)*4.;
        if(x<1.)return mix(a,b,smoothstep(0.,1.,x));
        if(x<2.)return mix(b,c,smoothstep(0.,1.,x-1.));
        if(x<3.)return mix(c,d,smoothstep(0.,1.,x-2.));
        return mix(d,a,smoothstep(0.,1.,x-3.));}
      void main(){
        vec2 uv=(gl_FragCoord.xy-.5*uRes)/(.5*min(uRes.x,uRes.y));
        float ang=atan(uv.y,uv.x);float t=uT;
        float wob=.022*(sin(ang*3.+t*1.3)+.6*sin(ang*5.-t*1.7))*(1.+uE*3.);
        float r=length(uv)/(.84+wob+uE*.03);
        if(r>1.03){gl_FragColor=vec4(0.);return;}
        vec2 p=uv*1.25-uLook*.3;
        for(int i=0;i<3;i++){float fi=float(i);p+=(.30+uE*.25)*vec2(sin(p.y*1.7+t*.5+fi),cos(p.x*1.5-t*.42+fi*1.7));}
        float n=.5+.5*sin(p.x*.9+p.y*.7+t*.18);
        vec3 col=pal(n*.85+t*.025);
        col=mix(col,vec3(.80,.86,1.),uShy*.5);
        col+=exp(-3.2*length(uv-vec2(-.30,.36)-uLook*.18))*.42;
        float rim=smoothstep(.70,1.,r);
        col=mix(col,pal(ang/6.2831+t*.04)+.12,rim*.5);
        col=mix(col,vec3(1.),.10);
        float a=1.-smoothstep(.975,1.02,r);
        gl_FragColor=vec4(col*a,a);}`;
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) root.classList.add('no-gl');
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = n => gl.getUniformLocation(pr, n);
      const uRes = U('uRes'), uT = U('uT'), uE = U('uE'), uShy = U('uShy'), uLook = U('uLook');
      draw = (t, e, shy, lx, ly) => {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
        if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
        gl.uniform2f(uRes, w, h); gl.uniform1f(uT, t); gl.uniform1f(uE, e); gl.uniform1f(uShy, shy); gl.uniform2f(uLook, lx, ly);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    }

    /* ---------- Layout: the orb lives in the space above the active pane ---------- */
    const head = document.querySelector('header');
    const size = new Spring(200, { stiffness: 120, damping: 20 });
    const cy = new Spring(260, { stiffness: 120, damping: 20 });
    const place = jump => {
      const pane = document.querySelector('.pane.' + root.dataset.view);
      const top = head.getBoundingClientRect().bottom;
      const paneTop = document.querySelector('.panes').getBoundingClientRect().top + pane.offsetTop;
      const free = paneTop - top;
      const s = Math.max(84, Math.min(230, free - 36));
      jump ? size.jump(s) : size.set(s);
      jump ? cy.jump(top + free / 2 - 8) : cy.set(top + free / 2 - 8);
    };
    addEventListener('resize', () => place(true));
    document.fonts && document.fonts.ready.then(() => place(true));
    place(true);

    /* ---------- Behaviour state ---------- */
    const energy = new Spring(0, { stiffness: 60, damping: 9 });
    const shy = new Spring(0, { stiffness: 90, damping: 16 });
    const sx = new Spring(1, { stiffness: 260, damping: 11 }), sy = new Spring(1, { stiffness: 260, damping: 11 });
    const lx = new Spring(0, { stiffness: 110, damping: 14 }), ly = new Spring(0, { stiffness: 110, damping: 14 });
    const blink = new Spring(1, { stiffness: 900, damping: 30 });
    let nextBlink = 2, focusInput = null, talking = 0;

    const isShy = () => {
      const a = document.activeElement;
      return a && a.type === 'password';
    };

    loop((dt, t) => {
      place(false);
      // where to look: the caret while typing, otherwise the finger / wander
      let gx = gaze.x, gy = gaze.y;
      if (focusInput && focusInput.type !== 'password') { const c = caret(focusInput); gx = c.x; gy = c.y; }
      const s = size.step(dt), y = cy.step(dt);
      const cx = innerWidth / 2;
      const dx = gx - cx, dy = gy - y, d = Math.hypot(dx, dy) || 1;
      const reach = Math.min(1, d / 160);
      lx.set(dx / d * reach); ly.set(dy / d * reach);
      shy.set(isShy() ? 1 : 0);
      if (talking > 0) { talking -= dt; energy.set(.25 + .2 * Math.sin(t * 18)); } else energy.set(0);
      const e = energy.step(dt), sh = shy.step(dt), LX = lx.step(dt), LY = ly.step(dt);
      // blinking
      nextBlink -= dt;
      if (nextBlink <= 0) { blink.set(.08); setTimeout(() => blink.set(1), 90); nextBlink = 2.2 + Math.random() * 4; if (Math.random() < .2) setTimeout(() => { blink.set(.08); setTimeout(() => blink.set(1), 90); }, 260); }
      const b = blink.step(dt);
      const breath = 1 + Math.sin(t * 1.6) * .012;
      const SX = sx.step(dt), SY = sy.step(dt);
      orb.style.width = orb.style.height = s + 'px';
      orb.style.margin = `${-s / 2}px 0 0 ${-s / 2}px`;
      orb.style.transform = `translateY(${y}px) scale(${SX * breath}, ${SY * breath})`;
      shadow.style.transform = `translateY(${y + s * .55}px) scale(${(s / 200) * (1.05 - (breath - 1) * 4)})`;
      orb.classList.toggle('shy', sh > .5);
      // eyes: look toward the target; when shy they glance down and away
      const es = s / 200;
      const ex = (LX * 16 * (1 - sh) - 6 * sh) * es, ey = (LY * 12 * (1 - sh) + 10 * sh) * es;
      face.style.setProperty('--es', es);
      face.style.setProperty('--blink', b);
      eyes[0].style.transform = `translate(${-21 * es + ex}px, ${-6 * es + ey}px)`;
      eyes[1].style.transform = `translate(${21 * es + ex}px, ${-6 * es + ey}px)`;
      blushes[0].style.transform = `translate(${-36 * es + ex * .6}px, ${16 * es + ey * .6}px)`;
      blushes[1].style.transform = `translate(${36 * es + ex * .6}px, ${16 * es + ey * .6}px)`;
      draw(t, e, sh, LX, -LY);
    });

    /* ---------- Touch: poke and drag the orb ---------- */
    let drag = null;
    orb.addEventListener('pointerdown', e => {
      drag = { x: e.clientX, y: e.clientY };
      orb.setPointerCapture(e.pointerId);
      sx.set(1.08); sy.set(.9); haptic(6);
    });
    orb.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = (e.clientX - drag.x) / 120, dy = (e.clientY - drag.y) / 120;
      sx.set(1 + Math.max(-.2, Math.min(.2, Math.abs(dx) - Math.abs(dy) * .5)));
      sy.set(1 + Math.max(-.2, Math.min(.2, Math.abs(dy) - Math.abs(dx) * .5)));
    });
    const lines = ['Hehe, that tickles.', 'Boop. Hi again!', 'I was just thinking about you.', 'Careful, I bounce.', 'Want to start something?'];
    orb.addEventListener('pointerup', () => {
      if (!drag) return; drag = null;
      sx.set(1); sy.set(1); sx.kick(-2.5); sy.kick(2.5); energy.kick(3);
      if (root.dataset.view === 'login') say(lines[Math.floor(Math.random() * lines.length)]);
    });

    /* ---------- Speaking ---------- */
    const sayEl = document.getElementById('say'), say2El = document.getElementById('say2');
    const say = (a, b) => {
      talking = Math.min(2.5, a.length * .05);
      stream(sayEl, a, { onDone: () => { if (b) { talking = b.length * .04; stream(say2El, b); } } });
    };
    document.addEventListener('kit:ready', () => setTimeout(() => say("Hi, I'm Wisp.", 'What should we think about today?'), 500));

    // Suggestion chips (duplicated for a seamless marquee)
    const ideas = ['Plan my week', 'Explain it like I\'m five', 'Draft a kind reply', 'Name my sourdough', 'Summarise this PDF', 'Trip ideas for May'];
    const chips = document.getElementById('chips');
    chips.innerHTML = [...ideas, ...ideas].map(i => `<button type="button" class="chip press">${i}</button>`).join('');
    chips.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      energy.kick(4); haptic(5);
      say(`Ooh, "${c.textContent}".`, 'Sign in and I\'ll start right away.');
    });

    // Typing makes the orb ripple; focus tells the eyes what to watch
    document.addEventListener('focusin', e => { if (e.target.matches('input')) focusInput = e.target; });
    document.addEventListener('focusout', () => { focusInput = null; });
    document.addEventListener('keydown', e => { if (e.target.matches('input')) { energy.kick(1.6); sx.kick(.25); sy.kick(-.25); } });
    document.addEventListener('kit:error', () => { sx.kick(3); sy.kick(-2); say('Hmm, that email looks a bit off.'); });
    document.addEventListener('kit:success', () => { energy.kick(6); say('Welcome back ✦', 'Picking up where we left off…'); });

    /* ---------- Sign up as a conversation ---------- */
    const thread = document.getElementById('thread'), cin = document.getElementById('cin'), send = document.getElementById('send'), composer = document.getElementById('composer');
    const data = {};
    const steps = [
      { ask: () => "Hey, I'm Wisp. What should I call you?", type: 'text', ph: 'Your name', key: 'name', ok: v => v.trim().length > 0, err: 'Even a nickname works!' },
      { ask: () => `Lovely to meet you, ${data.name}. What's your email?`, type: 'email', ph: 'you@email.com', key: 'email', ok: v => /^\S+@\S+\.\S+$/.test(v), err: "Hmm, that doesn't look like an email. One more try?" },
      { ask: () => "Last thing: pick a password. I'll close my eyes.", type: 'password', ph: '8 or more characters', key: 'pw', ok: v => v.length >= 8, err: 'A little longer please, at least 8 characters.' },
    ];
    let step = -1, busy = false;
    const add = (who, html) => {
      const m = document.createElement('div');
      m.className = 'msg ' + who;
      m.innerHTML = who === 'ai' ? '<span class="av"></span><p></p>' : '<p></p>';
      if (html) m.querySelector('p').innerHTML = html;
      thread.append(m);
      while (thread.children.length > 8) thread.firstElementChild.remove();
      return m.querySelector('p');
    };
    const aiSay = (text, done) => {
      busy = true;
      const p = add('ai', '<span class="typing"><i></i><i></i><i></i></span>');
      setTimeout(() => { talking = text.length * .045; stream(p, text, { caretEl: false, onDone: () => { busy = false; done && done(); } }); }, 650);
    };
    const next = () => {
      step++;
      if (step >= steps.length) {
        cin.disabled = true; cin.placeholder = 'Creating your space…';
        aiSay(`All set, ${data.name}. Making your space…`, () => { energy.kick(8); setTimeout(() => aiSay('Done ✦ Say hi whenever you\'re ready.'), 900); });
        return;
      }
      const s = steps[step];
      aiSay(s.ask(), () => { cin.type = s.type; cin.placeholder = s.ph; cin.value = ''; updateSend(); });
    };
    const updateSend = () => send.classList.toggle('on', cin.value.trim().length > 0 && !busy);
    cin.addEventListener('input', updateSend);
    const submit = () => {
      if (busy || step < 0 || step >= steps.length) return;
      const s = steps[step], v = cin.value;
      if (!v.trim()) return;
      add('me').textContent = s.type === 'password' ? '•'.repeat(Math.min(v.length, 14)) : v;
      haptic(6); energy.kick(2);
      cin.value = ''; updateSend();
      if (!s.ok(v)) { composer.classList.remove('shake'); void composer.offsetWidth; composer.classList.add('shake'); step--; aiSay(s.err, () => { step++; cin.type = s.type; cin.placeholder = s.ph; }); return; }
      data[s.key] = v.trim();
      if (s.type === 'password') cin.type = 'text';
      setTimeout(next, 250);
    };
    send.addEventListener('click', submit);
    composer.addEventListener('submit', e => { e.preventDefault(); submit(); });
    const startChat = () => { if (step === -1) setTimeout(next, 500); };
    document.addEventListener('kit:view', e => { place(false); if (e.detail.view === 'signup') startChat(); });
    if (root.dataset.view === 'signup') document.addEventListener('kit:ready', startChat);
  })();
  </script>
</body>
</html>
