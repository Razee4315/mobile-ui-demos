<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ff">
<title>Halo · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/screen-base.css">
<style>
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  :root { --ink: #1d1b2e; --muted: rgba(29,27,46,.58); --lilac: #c9c2ff; --ice: #bde8ff; --peach: #ffd9c7; --mint: #c8f5e4; }
  body { background: #f4f1ff; color: var(--ink); font: 400 15px/1.45 Outfit, system-ui, sans-serif; display: flex; flex-direction: column; padding: var(--top) 20px var(--bottom); position: relative; overflow: hidden; }

  /* Drifting pastel light */
  .mesh-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .mesh { position: absolute; inset: -20%; pointer-events: none; filter: blur(50px) saturate(1.15); }
  .mesh i { position: absolute; border-radius: 50%; opacity: .9; }
  .mesh i:nth-child(1) { width: 60%; height: 40%; left: 5%; top: 10%; background: var(--lilac); animation: d1 16s ease-in-out infinite alternate; }
  .mesh i:nth-child(2) { width: 55%; height: 38%; right: 0; top: 22%; background: var(--ice); animation: d2 18s ease-in-out infinite alternate; }
  .mesh i:nth-child(3) { width: 50%; height: 34%; left: 18%; top: 44%; background: var(--peach); animation: d1 20s ease-in-out infinite alternate-reverse; }
  .mesh i:nth-child(4) { width: 46%; height: 30%; right: 8%; bottom: 8%; background: var(--mint); animation: d2 14s ease-in-out infinite alternate-reverse; }
  @keyframes d1 { to { transform: translate(18%, 12%) scale(1.15); } }
  @keyframes d2 { to { transform: translate(-16%, 10%) scale(.9); } }

  header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; height: 46px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 22px; letter-spacing: -.5px; }
  .brand svg { width: 30px; height: 30px; }
  .now { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 6px 12px 6px 10px; border-radius: 99px; background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.9); backdrop-filter: blur(12px); }
  .eq { display: flex; align-items: end; gap: 2px; height: 12px; }
  .eq b { width: 2.5px; background: var(--ink); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq b:nth-child(2) { animation-delay: -.3s; } .eq b:nth-child(3) { animation-delay: -.6s; } .eq b:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }

  /* Liquid glass hero art: ring for sign in, droplet for sign up */
  .art { --size: clamp(90px, calc(var(--content-top, 330px) - var(--head-bottom, 98px) - 30px), 230px); position: absolute; z-index: 1; left: 50%; top: calc((var(--head-bottom, 98px) + var(--content-top, 330px)) / 2); width: var(--size); height: var(--size); transform: translate(-50%, -50%); transition: width 1s var(--ease), height 1s var(--ease), top 1s var(--ease); pointer-events: none; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .8s var(--ease), transform 1s var(--ease); }
  .art .ring { animation: tilt 10s ease-in-out infinite; }
  .art .blob { opacity: 0; transform: scale(.6) rotate(-20deg); }
  [data-view="signup"] .art .ring { opacity: 0; transform: scale(1.3) rotate(30deg); animation: none; }
  [data-view="signup"] .art .blob { opacity: 1; transform: none; animation: tilt 8s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-8px); } }
  .art::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -10%; height: 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(157,140,255,.35), transparent); }

  .panes { margin-top: auto; position: relative; z-index: 2; }
  .pane { align-self: end; }
  h1 { font-weight: 300; font-size: 40px; line-height: 1.02; letter-spacing: -1.4px; margin: 0 0 8px; }
  h1 b { font-weight: 500; background: linear-gradient(90deg, #6d5cff, #c86dd7 55%, #ff8f6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }

  .glass { position: relative; border-radius: 30px; padding: 14px; background: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.28)); border: 1px solid rgba(255,255,255,.9);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 24px 50px -24px rgba(80,60,160,.35), inset 0 1px 1px rgba(255,255,255,1), inset 0 -1px 1px rgba(157,140,255,.15); }
  form { display: grid; gap: 10px; }
  .field { height: 54px; border-radius: 99px; background: rgba(255,255,255,.66); border: 1px solid rgba(255,255,255,.95); padding: 0 18px; gap: 11px; color: var(--muted); transition: box-shadow .3s, background .3s; }
  .field:focus-within { background: #fff; box-shadow: 0 0 0 4px rgba(157,140,255,.25); color: var(--ink); }
  .field input { font-size: 15.5px; }
  .field input::placeholder { color: rgba(29,27,46,.42); }
  .field a { font-size: 13px; color: #6d5cff; text-decoration: none; white-space: nowrap; }
  .eye { display: grid; color: var(--muted); }
  .strength { --meter: linear-gradient(90deg, #9d8cff, #ff8f6b); color: var(--ink); padding: 0 10px; }

  /* Ink button with a slowly turning iridescent rim */
  .primary { height: 56px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 500; font-size: 16px; display: grid; place-items: center; margin-top: 2px; isolation: isolate; transition: transform .2s var(--ease); }
  .primary::before { content: ""; position: absolute; inset: -2px; border-radius: inherit; z-index: -1; padding: 2px;
    background: conic-gradient(from var(--a), #9d8cff, #7fd8ff, #8ff0c8, #ffd08f, #ff9fc4, #9d8cff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: rim 4s linear infinite; }
  .primary .btn-label { z-index: 1; }
  .primary:active { transform: scale(.98); }
  .primary.done { background: #2e7d5b; }
  @keyframes rim { to { --a: 360deg; } }

  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .socials button { height: 50px; border-radius: 99px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.95); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; transition: background .3s, transform .2s; }
  .socials button:active { transform: scale(.97); }
  .socials .ico { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--muted); font-size: 14px; margin: 16px 0 4px; }
  .foot a { color: var(--ink); font-weight: 500; text-decoration: none; border-bottom: 1.5px solid #9d8cff; }
  .terms { font-size: 12px; color: var(--muted); text-align: center; margin: 2px 0 0; }
</style>
</head>
<body>
  <div class="mesh-wrap" aria-hidden="true"><div class="mesh"><i></i><i></i><i></i><i></i></div></div>

  <header class="rise" style="--d:0">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d8cff"/><stop offset=".5" stop-color="#7fd8ff"/><stop offset="1" stop-color="#ff9fc4"/></linearGradient></defs>
        <ellipse cx="16" cy="16" rx="13" ry="7" fill="none" stroke="url(#hg)" stroke-width="3.2" transform="rotate(-24 16 16)"/>
        <circle cx="16" cy="16" r="3.4" fill="#1d1b2e"/>
      </svg>
      halo
    </div>
    <span class="now"><span class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b></span>Rain on glass</span>
  </header>

  <div class="art" aria-hidden="true">
    <div class="rise" style="--d:1;position:absolute;inset:0">
      <img class="ring" src="../../assets/web/halo-ring.webp" width="900" height="828" alt="">
      <img class="blob" src="../../assets/web/halo-blob.webp" width="900" height="533" alt="">
    </div>
  </div>

  <main class="panes">
    <section class="pane login" aria-label="Sign in">
      <h1 class="rise" style="--d:2">Breathe in.<br><b>Tune out.</b></h1>
      <p class="sub rise" style="--d:3">Soundscapes that follow your breath.</p>
      <div class="glass rise" style="--d:4">
        <form>
          <label class="field"><i data-icon="mail"></i><span class="sr">Email</span><input type="email" placeholder="Email" autocomplete="email"></label>
          <label class="field"><i data-icon="lock"></i><span class="sr">Password</span><input type="password" placeholder="Password" autocomplete="current-password"><a href="#" data-fake>Forgot?</a></label>
          <button class="primary" type="submit"><span class="btn-label">Sign in</span></button>
        </form>
      </div>
      <div class="socials rise" style="--d:5">
        <button data-fake><i data-icon="apple"></i>Apple</button>
        <button data-fake><i data-icon="google"></i>Google</button>
      </div>
      <p class="foot rise" style="--d:6">First time here? <a href="#" data-go="signup">Create an account</a></p>
    </section>

    <section class="pane signup" aria-label="Create account">
      <h1>Find your<br><b>quiet frequency.</b></h1>
      <p class="sub">Seven days of every sound, on us.</p>
      <div class="glass">
        <form>
          <label class="field"><i data-icon="user"></i><span class="sr">Name</span><input type="text" placeholder="Name" autocomplete="name"></label>
          <label class="field"><i data-icon="mail"></i><span class="sr">Email</span><input type="email" placeholder="Email" autocomplete="email"></label>
          <label class="field"><i data-icon="lock"></i><span class="sr">Password</span><input type="password" placeholder="Password" autocomplete="new-password" data-strength>
            <button class="eye" data-eye type="button" aria-label="Show password"><i data-icon="eye"></i><i data-icon="eye-off"></i></button></label>
          <div class="strength" data-score="0"><i></i><i></i><i></i><i></i><span class="strength-label"></span></div>
          <button class="primary" type="submit"><span class="btn-label">Start listening</span></button>
          <p class="terms">By continuing you accept the Terms &amp; Privacy Policy.</p>
        </form>
      </div>
      <p class="foot">Already have an account? <a href="#" data-go="login">Sign in</a></p>
    </section>
  </main>

  <script src="../../shared/icons.js"></script>
  <script src="../../shared/screen.js"></script>
</body>
</html>
